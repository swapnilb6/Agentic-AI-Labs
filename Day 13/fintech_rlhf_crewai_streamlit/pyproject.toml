[project]
name = "fintech-rlhf-crewai-streamlit"
version = "0.1.0"
description = "CrewAI + Streamlit demo for fintech RLHF-style human feedback loops."
requires-python = ">=3.13,<3.14"
dependencies = [
  "crewai>=0.63.1,<0.64",
  "streamlit>=1.41,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]

[tool.streamlit]
browser.gatherUsageStats = false
