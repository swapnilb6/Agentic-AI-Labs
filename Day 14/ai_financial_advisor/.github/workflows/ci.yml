# .github/workflows/ci.yml
# ════════════════════════════════════════════════════════════════
#  CI/CD Pipeline — AI Financial Advisor
#  Triggered on: push to main/dev, pull requests to main
# ════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:

  # ── 1. Lint & Format ────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install linting tools
        run: pip install ruff==0.4.4

      - name: Run Ruff linter
        run: ruff check . --ignore E501,E402

  # ── 2. Unit Tests (no LLM) ──────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (No LLM)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for tests
        run: |
          echo "OPENAI_API_KEY=dummy_for_unit_tests" > .env
          echo "OPENAI_MODEL=gpt-4o-mini" >> .env

      - name: Run unit tests (skip LLM tests)
        run: |
          pytest tests/test_evaluation.py -v -k "not llm" \
            --tb=short \
            --junit-xml=test-results/unit-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  # ── 3. API Health Check ─────────────────────────────────────────────────────
  api-test:
    name: FastAPI Health Check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          echo "OPENAI_API_KEY=dummy" > .env
          echo "OPENAI_MODEL=gpt-4o-mini" >> .env

      - name: Start API server
        run: |
          uvicorn api:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Test health endpoint
        run: curl -f http://localhost:8000/health

      - name: Test summary endpoint (no LLM)
        run: curl -f http://localhost:8000/summary

      - name: Test risk-profile endpoint (no LLM)
        run: curl -f http://localhost:8000/risk-profile

  # ── 4. Docker Build ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: api-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-financial-advisor:${{ github.sha }} .

      - name: Test Docker container starts
        run: |
          docker run -d \
            -e OPENAI_API_KEY=dummy \
            -p 8000:8000 \
            --name test-container \
            ai-financial-advisor:${{ github.sha }}
          sleep 8
          curl -f http://localhost:8000/health || (docker logs test-container && exit 1)
          docker stop test-container

  # ── 5. Deploy to Production (main branch only) ──────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to container registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
          docker login ${{ secrets.REGISTRY_URL }} \
            -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Tag and push image
        run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/ai-financial-advisor:latest \
                       -t ${{ secrets.REGISTRY_URL }}/ai-financial-advisor:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_URL }}/ai-financial-advisor:latest
          docker push ${{ secrets.REGISTRY_URL }}/ai-financial-advisor:${{ github.sha }}

      - name: Deploy via SSH (example — adapt to your host)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ai-financial-advisor
            docker pull ${{ secrets.REGISTRY_URL }}/ai-financial-advisor:latest
            docker-compose down
            docker-compose up -d
            echo "✅ Deployment complete"

      - name: Notify on success
        if: success()
        run: echo "🚀 Deployed ai-financial-advisor:${{ github.sha }} to production"
